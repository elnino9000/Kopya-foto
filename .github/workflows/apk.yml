name: APK olustur
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Sabit imza anahtari
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Proje iskeleti
        run: |
          mkdir -p lib && mv main.dart lib/main.dart
          flutter create --platforms=android --project-name kopyafoto --org com.kopyafoto .
      - name: Android ayarlari
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          m = p.read_text(encoding='utf-8')
          perms = (
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION"/>\n'
          )
          m = m.replace('<application', perms + '    <application android:requestLegacyExternalStorage="true"', 1)
          m = re.sub(r'android:label="[^"]*"', 'android:label="Kopya Foto"', m, count=1)
          p.write_text(m, encoding='utf-8')
          print(m)
          PY
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: kopya-foto-apk
          path: build/app/outputs/flutter-apk/app-release.apk
